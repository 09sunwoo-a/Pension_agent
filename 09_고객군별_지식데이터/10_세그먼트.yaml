# ─────────────────────────────────────────────────────────────
- id: SEG-06
  name: "예금·GIC 만기예정"
  aliases: ["만기 1개월 전 원리금보장상품 보유", "만기 임박 & 디폴트옵션 미등록"]
  one_line: "만기가 곧 재설계 창구인 고객 — 자동 재예치가 폐지돼 방치하면 만기자금이 그대로 현금성자산이 된다"
  business_goal: [수익률제고, 이탈방어, 관리사이클]

  population:
    base: "당행 개인형IRP 보유 고객 · 원리금보장상품(시중·저축은행 정기예금, GIC, ELB) 보유"
    include:
      - field: 보유상품_만기잔여일수
        op: "<="
        value: 30
        as_of: "2026.03"
        source: KU-M-025
        note: "본부 원칙 — 만기 1개월 전 반드시 만기 안내"
      - field: 만기도래상품_금액
        op: ">="
        value: 100000
        as_of: "2023~24"
        source: KU-M-026
    exclude:
      - field: 연금개시여부
        op: "=="
        value: true
        source: KU-G-002
        note: "수령 중 계좌는 인출 설계와 충돌 — 별도 판단"

  threshold_variants:
    - value: "만기 1개월 이내 (금액 조건 없음)"
      source: "보물지도 기존 고객 관리 4원칙 (SEG doc 9번)"
      as_of: "2026.03"
      purpose: "만기 안내 필수 행동"
      adopted: true
    - value: "1개월 내 만기도래 10만원 이상 & 적립금 500만원 이상 & 디폴트옵션 미등록"
      source: "오늘의할일 시트34 (SEG doc 6번)"
      as_of: "2023~24"
      purpose: "예방적 디폴트옵션 등록 유도"
      adopted: true
      note: "만기 트랙 중 우선순위 최상 — 방치 시 SEG-02·SEG-03으로 즉시 전이"
    - value: "익월 만기금액 1천만원 이상"
      source: "2021 자료 (SEG doc 9번 검토메모)"
      as_of: "2021"
      purpose: "금액 기준 절단"
      adopted: false
      note: "판독 불확실 — 현행 기준 여부 확인 필요"
    - value: "디폴트옵션 안정형 · 기업·하나·신한 3년제 상품 보유"
      source: "Hot Tip 207088 (SEG doc 42번)"
      as_of: "2026.07"
      purpose: "중도해지 유불리 확인 대상"
      adopted: false
      note: "만기 전 교체 검토 트랙 — 만기 트랙과 별개"

  recommended_target:
    rule: "만기 D-30 이내 원리금보장상품 10만원 이상 보유 AND 디폴트옵션 미등록 (1순위) → 디폴트옵션 등록 완료 계좌 중 만기 D-30 (2순위, 재예치 금리 상향 목적)"
    expected_scale: "매월 첫째 주 만기명세 규모"
    rationale: |
      만기는 유일하게 '고객이 이상하게 여기지 않는' 접촉 명분이고, 기한이 붙어 자동으로 우선순위가 정해진다.
      디폴트옵션 미등록 여부로 두 트랙을 가르는 이유는 방치 시 결과가 다르기 때문이다 —
      미등록이면 만기자금이 현금성자산으로 상환되어 편중 계좌가 되고, 등록돼 있으면 자동 운용되지만 금리가 낮을 수 있다.

  false_positive_filters:
    - check: "만기 자금이 인출·연금지급 예정 자금인가"
      action: "예정이면 재예치 권유 대신 인출 설계로 전환"
      source: KU-M-004
    - check: "중도해지 손실 vs 개선 이익"
      action: "만기 전 교체를 검토할 때만 — [04-12-642] 연계 계산기로 유불리 확인 후 판단"
      source: KU-M-006
    - check: "당월 특별제공상품 금리를 확인했는가"
      action: "금리는 월 단위 확정 — 월말 매수 시 다음 달 금리가 적용된다"
      source: KU-F-018

  priority:
    sort_keys: ["만기일 오름차순", "만기금액 내림차순", "디폴트옵션 미등록 우선"]
    scoring: null

  data_requirements:
    - 보유상품_상품명·유형(정기예금/GIC/ELB)
    - 만기일·만기잔여일수
    - 만기도래금액
    - 적립금_평가금액
