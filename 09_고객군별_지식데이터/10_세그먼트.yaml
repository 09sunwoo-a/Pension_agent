%YAML 1.2
---
# ============================================================
# 10_세그먼트.yaml — 고객군 6종 정의
# 규격: 00_스키마.md § 1
# 원천: 06_주제별_추출지식/01_고객세그먼트.md, 02_IRP관리방법론.md,
#       04_제도상품팩트.md, 05_업무처리절차.md
# 작성: 2026-08-23
# ============================================================

meta:
  version: "1.0"
  as_of: "2026-08-23"
  scope: "당행 개인형IRP 보유 고객의 사후관리 (신규유치·기업형 DB/DC 제외)"
  note: |
    임계값이 자료마다 다른 항목은 threshold_variants에 전부 적재하고,
    adopted: true 인 값 하나만 recommended_target에 반영했다.
    adopted 선택은 이 문서 작성 시점의 제안이며 팀 확정 대상이다.

# ── 고객군 간 관계 ──────────────────────────────────────────
# 한 고객이 여러 고객군에 동시에 걸린다. 무엇을 먼저 보고, 어디로 넘기는가.
routing:
  # 동시 해당 시 처리 순서 (위에서부터)
  precedence:
    - segment: SEG-04
      when: "전출 알림이 수신된 경우"
      reason: "이벤트형이고 기한이 있다 — 다른 모든 고객군에 우선한다"
    - segment: SEG-05
      when: "ISA 만기·퇴직금 60일 타이머가 돌고 있는 경우"
      reason: "지나면 기회가 소멸한다 (기한 > 조회형)"
    - segment: SEG-06
      when: "만기 D-30 상품이 있는 경우"
      reason: "고객이 이상하게 여기지 않는 접촉 명분이고, 방치 시 SEG-02·03으로 전이된다"
    - segment: SEG-02
      when: "편중 조건에 해당하는 경우"
      reason: "이탈률 1.3배 — 예방 트랙 중 근거가 가장 강하다"
    - segment: SEG-01
      when: "수익률 격차가 큰 경우"
      reason: "원인(구성/상품)이 특정될 때만 제안이 나온다"
    - segment: SEG-03
      when: "위 어느 것에도 안 걸리지만 접점이 없는 경우"
      reason: "상시 트랙 — 관계 형성 자체가 목적"

  # 고객군 사이의 상태 전이 (방치하면 이렇게 옮겨간다)
  transitions:
    - {from: SEG-06, to: SEG-02, trigger: "만기 후 운용지시 없음", note: "자동 재예치 폐지로 만기자금이 현금성자산으로 상환된다"}
    - {from: SEG-03, to: SEG-02, trigger: "퇴직금 입금 후 미운용 지속", note: "금액이 커서 즉시 편중 계좌가 된다"}
    - {from: SEG-02, to: SEG-04, trigger: "편중 상태 방치", note: "이탈위험도 1.3배"}
    - {from: SEG-03, to: SEG-04, trigger: "미접촉 지속", note: "관리되지 않은 계좌의 이탈은 막을 수 없다"}
    - {from: SEG-01, to: SEG-02, trigger: "부진 펀드 매도만 하고 매수 미실행", note: "매도 대금이 현금성자산으로 남는다"}
    - {from: SEG-04, to: SEG-05, trigger: "방어 성공 & 퇴직금 포함", note: "인출 설계 상담으로 이어진다"}
    - {from: SEG-05, to: SEG-03, trigger: "입금 후 운용지시 없음", note: "자금이 들어와도 운용되지 않으면 방치다"}

  # 어느 고객군에서도 공통으로 빼는 조건
  common_exclusions:
    - {rule: "연금개시·수령 중 계좌", applies_to: [SEG-01, SEG-02, SEG-03, SEG-05, SEG-06], source: KU-G-002}
    - {rule: "'연금지급설계' 등록 계좌 (추가납 한정)", applies_to: [SEG-05], source: KU-G-011}
    - {rule: "PB센터 관리고객 (본부 TM 명세 기준)", applies_to: [SEG-01, SEG-02], source: KU-M-010}
    - {rule: "계좌 상태 제약 — 상품변경 진행중·환매불가·퇴직금 미입금", applies_to: [SEG-04], source: KU-M-016}

segments:

# ─────────────────────────────────────────────────────────────
- id: SEG-01
  name: "수익률 저조"
  aliases: ["수익률 하위 고객", "관리 포인트 D", "수익률·자산관리 불만 고객"]
  one_line: "적립금은 있으나 수익률이 기준선에 크게 못 미치는 고객 — 지적이 아니라 개선안으로 접근한다"
  business_goal: [수익률제고, 이탈방어]

  population:
    base: "당행 개인형IRP 보유 고객"
    include:
      - field: 계좌_1년수익률
        op: "<="
        value: null
        as_of: null
        source: KU-E-011
        note: "현행(2026) 자료에 정량 임계값이 없다. recommended_target의 격차 기준을 사용한다"
      - any_of:
          - field: 원리금보장상품_비중
            op: "=="
            value: 1.00
            as_of: "2024"
            source: KU-M-009
            note: "유형 A — 저수익 원인이 구성에 있음"
          - field: 성과저조펀드_보유여부
            op: "=="
            value: true
            as_of: "2023~24"
            source: KU-M-010
            note: "유형 B — 저수익 원인이 개별 상품에 있음"
    exclude:
      - field: 고객관리점
        op: "=="
        value: "PB센터"
        as_of: "2023~24"
        source: KU-M-010
        note: "환매추천펀드 기준 명세의 본부 제외 조건"
      - field: 연금개시여부
        op: "=="
        value: true
        source: KU-G-002
        note: "투자상품 권유 제외 (연금수령액 감소)"

  threshold_variants:
    - value: "1년 수익률 1.50% 이하 또는 부점 내 하위 30%"
      source: "KPI시나리오 2021 (SEG doc 24번)"
      as_of: "2021"
      purpose: "KPI 평가대상 선정"
      adopted: false
      note: "실효. 금리 환경이 달라 그대로 쓰면 과다·과소 추출"
    - value: "IRP 고객 1년 평균 수익률과의 격차 -5%p 이상"
      source: "방법론 3번(세 기준선) 기반 제안값"
      as_of: "2026.08"
      purpose: "타깃 추출 기본값 제안"
      adopted: true
      note: "정리자 제안값 — 팀 확정 필요. 기준선 수치는 KU-E-011에서 매 분기 갱신"

  recommended_target:
    rule: "적립금 300만원 이상 AND (원리금보장 100% 운용 OR 환매추천펀드 보유) AND 1년 수익률이 당행 IRP 평균 대비 -5%p 이상 열위"
    expected_scale: "미산출 — 데이터 확보 후 산정 필요"
    rationale: |
      '수익률 저조'만으로는 임계값이 없어 모집단이 정의되지 않는다.
      원인 유형(구성 문제 / 상품 문제)을 조건에 포함시켜야 시나리오가 갈리고 제안이 나온다.
      원인 없는 저조 계좌는 접촉해도 제안할 것이 없다.

  false_positive_filters:
    - check: "최근 6개월 내 신규·전입 계좌인가"
      action: "운용기간이 짧아 수익률이 낮은 것이므로 제외"
      source: KU-M-002
      confidence: low
      note: "정리자 제안 — 원자료에 명시 없음"
    - check: "연금개시·수령 중인가"
      action: "제외 (KU-G-002)"
      source: KU-G-002
    - check: "수익률 저조가 시장 전반 요인인가"
      action: "제외하지 않되, 오프너에서 시장 상황을 먼저 언급해 개인 실패감을 완화한다"
      source: KU-S-008

  priority:
    sort_keys: ["적립금 내림차순", "기준선 격차 큰 순", "최근 접촉 없는 순"]
    scoring: null

  data_requirements:
    - 적립금_평가금액
    - 계좌_1년수익률
    - 상품구성_3층(현금성/원리금보장/실적배당)
    - 보유펀드_수익률
    - 환매추천펀드_해당여부
    - 최근접촉일자
    - 만연령
    - 투자성향분석결과

  lookup_screens:
    - code: "[04-12-642]"
      name: "적립금 및 수익률 조회"
      purpose: "수익률·상품구성 기본 진단 화면"
    - code: "[06-12-631]"
      name: "퇴직연금 고객포털 > 퇴직연금 컨설팅"
      purpose: "동일 연령대 수익률 상위 고객 운용현황 대조 (비교그룹)"
    - code: "[04-50-007]"
      name: "공모펀드 조회(폐기계좌 포함)"
      purpose: "투자 경험 유무 교차 확인 → 안전선호/분산가능 분기"

  why_now:
    - claim: "방치의 기회비용을 세 기준선과의 격차로 제시한다"
      number: "IRP 고객 1년 평균 7.97% / 시중은행 정기예금 3.02% / 고유계정대 2.52%"
      as_of: "수익률 2026.1Q, 금리 2026.05"
      ku: KU-E-011
    - claim: "퇴직연금 저수익의 구조적 원인은 정기예금 편중"
      number: "퇴직연금 5년 2.35% vs 국민연금 6.21%"
      as_of: "2023"
      ku: KU-E-012
    - claim: "수익률 불만은 대표적 이탈 사유 — 수익률 관리가 곧 이탈방어"
      number: null
      as_of: "2026.03"
      ku: KU-E-004

  kpi_link: null

  briefing_slots:
    why_target: "수익률 {n}% · 당행 IRP 평균 {avg}% 대비 {gap}%p 열위 · 원인: {구성편중|상품부진}"
    snapshot: "적립금 / 3층 구성 / 보유펀드별 수익률 / 만기 임박 상품"
    customer_unknown: "동일 연령대 상위 고객의 운용 구성 (비교그룹 조회 결과)"
    today_offer: "offers[0]"
    expected_objections: [KU-S-002, KU-S-003, KU-S-009]
    do_not: [KU-G-001, KU-G-003, KU-G-005]
    precheck_screens: ["[06-12-631]", "[04-12-642]"]

  offers:
    - rank: 1
      action: "부진 상품 매도 + 시황에 맞는 상품 재추천"
      ku: KU-S-007
      condition: "부진 실적배당상품 보유"
    - rank: 2
      action: "일부 자금(30% 수준)의 실적배당 전환"
      ku: KU-S-006
      condition: "전액 원리금보장 운용"
    - rank: 3
      action: "동일 연령대 상위 고객 운용현황 대조 후 분산투자 제안"
      ku: KU-M-002
      condition: "직접 지적이 어려운 민감 고객"

  knowledge_units:
    - {ku: KU-E-011, role: "진단 기준선"}
    - {ku: KU-E-012, role: "구조적 원인 논거"}
    - {ku: KU-E-013, role: "당행 성과 반박 근거"}
    - {ku: KU-M-001, role: "3층 진단"}
    - {ku: KU-M-002, role: "비교그룹 대조 방법"}
    - {ku: KU-M-009, role: "유형 A 대응 원칙"}
    - {ku: KU-M-010, role: "유형 B 대응 원칙"}
    - {ku: KU-S-006, role: "유형 A 화법"}
    - {ku: KU-S-007, role: "유형 B 화법"}
    - {ku: KU-S-008, role: "민감 응대 오프너"}
    - {ku: KU-S-009, role: "저금리 안주 반론 (72의 법칙)"}
    - {ku: KU-S-010, role: "모니터링 주기 안내"}
    - {ku: KU-F-020, role: "실적배당 수익률 공시 인용 규칙"}
    - {ku: KU-P-001, role: "수익률 조회 경로"}

  scenarios: [SC-01-A, SC-01-B, SC-01-C]

  guardrails: [KU-G-001, KU-G-003, KU-G-005, KU-G-002]

  followup:
    - trigger: "제안 수용"
      interval: "6개월"
      action: "수익률 재점검 예약 (KU-M-011)"
    - trigger: "제안 거절"
      interval: "3개월"
      action: "다음 만기·이벤트 시점에 재접촉 예약"

  open_questions:
    - "'수익률 저조'의 정량 임계값 — 현행 본부 기준이 없어 팀 정의 필요 (SEG doc 10번)"
    - "환매추천펀드 목록의 현행 운영 여부 (분기별 갱신 여부) — SEG doc 8번 검토메모"
    - "[06-12-631] 비교그룹 조회 화면의 현행 여부 — 2021~22년 자료 기반"

# ─────────────────────────────────────────────────────────────
- id: SEG-02
  name: "자산편중"
  aliases: ["현금성자산·정기예금 편중", "고유대 과다 보유", "원리금보장 100% 운용"]
  one_line: "적립금이 현금성자산·원리금보장상품 한쪽에 몰려 있는 고객 — 이탈률이 일반의 1.3배인 본부 최우선 관리군"
  business_goal: [수익률제고, 이탈방어]

  population:
    base: "당행 개인형IRP 보유 고객 · 적립금 1천만원 이상"
    include:
      - any_of:
          - field: 고유계정대_보유비율
            op: ">="
            value: 0.50
            as_of: "2026.05"
            source: KU-E-001
          - field: "고유계정대+시중은행정기예금_보유비율"
            op: "=="
            value: 1.00
            as_of: "2026.05"
            source: KU-E-001
          - field: 원리금보장상품_보유비율
            op: "=="
            value: 1.00
            as_of: "2023~24"
            source: KU-M-009
            note: "디폴트옵션 초저위험 포함"
    exclude:
      - field: 고객관리점
        op: "=="
        value: "PB센터"
        as_of: "2023~24"
        source: KU-M-010
        note: "PB센터 관리고객은 본부 TM 명세에서 제외 — 담당 PB가 별도 관리"
      - field: "투자성향==공격투자형 AND 디폴트옵션==초저위험"
        op: "=="
        value: true
        as_of: "2023~24"
        source: KU-M-003
        note: "성향-운용 불일치 건은 별도 관리 (SEG doc 5번)"
      - field: 연금개시여부
        op: "=="
        value: true
        source: KU-G-002
        note: "투자상품 권유 제외 — 고유대 자금이 잠기면 연금수령액이 줄어든다"

  threshold_variants:
    - value: "고유계정대 보유비율 50% 이상 (또는 고유대+시중은행 정기예금 100%), 적립금 1천만원 이상"
      source: "Series1 (SEG doc 1번)"
      as_of: "2026.05"
      purpose: "이탈위험 선별 — 본부 최우선 세그먼트"
      adopted: true
    - value: "적립금 1천만원 이상 & 고유대 또는 시중은행 정기예금 1천만원 이상"
      source: "Hot Tip 207754·207088 (SEG doc 40번)"
      as_of: "2026.07~08"
      purpose: "2026 하반기 KPI 고객수 인정 요건"
      adopted: false
      note: "실적 인정 기준이지 고객 이익 기준이 아니다. 접촉 대상 정렬에만 참고"
    - value: "대기 현금성자산 7,500만원 이상"
      source: "오늘의할일 시트25 (SEG doc 3번)"
      as_of: "2023~24"
      purpose: "TM 콜 배분 (고비용 채널 우선순위)"
      adopted: false
    - value: "현금성자산 100만원 이상"
      source: "KPI시나리오 2021 (SEG doc 3번)"
      as_of: "2021"
      purpose: "대량 LMS 자동발송"
      adopted: false
    - value: "디폴트옵션 미동의 & 현금성 대기자산 10만원 이상"
      source: "Hot Tip 9737 (SEG doc 41번)"
      as_of: "2023.09"
      purpose: "디폴트옵션 시행기 대량 안내"
      adopted: false
