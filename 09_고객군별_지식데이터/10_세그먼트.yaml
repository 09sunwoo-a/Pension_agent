    expected_scale: "①은 알림 발생 건수 그대로, ②는 SEG-02와 상당 부분 중첩"
    rationale: |
      본부 인력 4명으로 전행 전출 신청을 소화할 수 없어 영업점 직접 방어가 지정됐다(KU-E-004).
