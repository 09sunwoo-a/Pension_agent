- id: SEG-04
  name: "이탈가능성 높음"
  aliases: ["이탈 고위험군", "계약이전(전출) 신청 고객", "재이탈 위험군"]
  one_line: "전출 알림이 왔거나, 이탈 신호가 겹쳐 쌓인 고객 — 사유를 특정하기 전에는 대안을 꺼내지 않는다"
  business_goal: [이탈방어]

  population:
    base: "당행 개인형IRP 보유 고객"
    include:
      - any_of:
          - field: 계약이전_전출신청_접수
            op: "=="
            value: true
            as_of: "2026.03"
            source: KU-E-004
            note: "이벤트형 — 알림 수신 시점에 발동. 시급성 최상"
          - field: 이탈신호_충족개수
            op: ">="
            value: 2
            as_of: "2026.08"
            source: KU-M-015
            note: "조회형 — 아래 signal_set 중 2개 이상"
    exclude:
      - field: 계좌상태
        op: in
        value: ["상품변경 진행중", "환매불가상품 보유", "퇴직금 일부 미입금"]
        source: KU-M-016
        note: "이전 자체가 진행되지 않는 상태 — 방어 우선순위 조정"

  signal_set:
    - {signal: "고유계정대 50% 이상 또는 고유대+시중은행 정기예금 100%", weight: "이탈률 1.3배", ku: KU-E-001}
    - {signal: "타행에서 전입한 이력 있음", weight: "재이탈 의향 82.5%", ku: KU-E-006}
    - {signal: "ETF 투자 성향 또는 ETF 라인업 불만 표명", weight: "증권사 이탈 고객의 82%가 ETF 투자자", ku: KU-E-007}
    - {signal: "대면 개설 계좌 & 수수료 문의 이력", weight: "면제 카드가 있는데 안내가 안 된 상태", ku: KU-F-010}
    - {signal: "6개월 이상 미접촉 (관리 사각)", weight: "관리소홀이 이탈의 선행 원인", ku: KU-E-005}
    - {signal: "KB스타클럽 VIP·그랜드 이상 등급", weight: "이탈 시 손실 규모 — 사유가 아닌 등급 축 가중", ku: KU-S-024}

  threshold_variants:
    - value: "계약이전(전출) 알림 수신"
