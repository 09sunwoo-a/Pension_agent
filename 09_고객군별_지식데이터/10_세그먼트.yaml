- id: SEG-03
  name: "방치"
  aliases: ["관리 사각지대", "미운용 계좌", "디폴트옵션 미지정", "무권유 비대면 신규"]
  one_line: "운용지시도 관리 접점도 없는 계좌 — 이탈 통보가 오기 전에 손을 대야 하는 유일한 구간"
  business_goal: [관리사이클, 이탈방어, 수익률제고]

  population:
    base: "당행 개인형IRP 보유 고객"
    include:
      - any_of:
          - field: 운용지시_실행여부
            op: "=="
            value: false
            as_of: "2026"
            source: KU-M-013
            note: "유형 A — 퇴직금·자금 입금 후 운용지시 미실행"
          - field: 디폴트옵션_등록여부
            op: "=="
            value: false
            as_of: "2026"
            source: KU-M-014
            note: "유형 B — 디폴트옵션 미지정"
          - field: "비대면신규 AND 권유직원_부재"
            op: "=="
            value: true
            as_of: "2026.03"
            source: KU-E-003
            note: "유형 C — 관리 접점 자체가 없음"
          - field: 최근접촉경과월수
            op: ">="
            value: 6
            as_of: "2026"
            source: KU-M-011
            note: "유형 D — 미접촉 방치"
    exclude:
      - field: 계좌잔액
        op: "=="
        value: 0
        note: "0원 계좌는 방치가 아니라 자금 유입 대기 — SEG-05로 라우팅"
        source: KU-M-020
      - field: 연금개시여부
        op: "=="
        value: true
        source: KU-G-002
        note: "수령 중 계좌는 방치 판정에서 제외 (별도 관리)"

  threshold_variants:
    - value: "비대면 신규 & 권유직원 미존재"
      source: "보물지도 타겟리스트 '이탈방지' 유형 (SEG doc 11번)"
      as_of: "2026.03"
      purpose: "본부 제공 이탈방지 타깃"
      adopted: true
    - value: "디폴트옵션 미지정 전체 (조건 없음)"
      source: "맞춤형 타깃 요청, 내외동지점 (SEG doc 7번)"
      as_of: "2026"
      purpose: "이탈 관리"
      adopted: false
      note: "모집단이 지나치게 넓다. 우선순위 스코어링 없이는 사용 불가"
    - value: "퇴직금 입금 & 운용지시 없음 또는 일부만"
      source: "맞춤형 타깃 요청, 충청·호남영업추진그룹 (SEG doc 18번)"
      as_of: "2026"
      purpose: "고객관리 및 리밸런싱"
      adopted: true
      note: "금액이 커서 방치 시 SEG-02로 즉시 전이"
    - value: "신탁형ISA 현금성자산 500만원 이상 2개월 경과"
      source: "SEG doc 28번 (참고)"
      as_of: "미상"
      purpose: "임계값 설계 참고 — '금액 + 경과기간' 2축"
      adopted: false

  recommended_target:
    rule: "퇴직금 입금 후 운용지시 미실행 계좌 (1순위) → 비대면 신규 & 권유직원 부재 & 적립금 1천만원 이상 (2순위)"
    expected_scale: "미산출"
    rationale: |
      '방치'는 정의가 넓어 그대로 쓰면 전 고객이 걸린다.
      금액이 크고 시점이 특정되는 것(퇴직금 입금 직후)부터 좁히면
      SEG-02(편중)로 전이되기 전에 잡을 수 있어 예방 효과가 가장 크다.
      디폴트옵션 미지정 전수는 요건 충족수 스코어링으로 상위만 잘라 쓴다.

