    선택지가 많은 게 늘 유리하지는 않아서, 대부분 고객님들은 오히려 900개 중에
    무엇이 좋은지 고르기가 더 어렵다고 하십니다.
    고객님께서 원하시는 지수가 있으시면, 저희 라인업 안에서 같은 지수를 추종하는 상품으로
    바로 찾아드릴게요."
