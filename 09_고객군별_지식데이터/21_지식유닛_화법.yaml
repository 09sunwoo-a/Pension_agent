- id: KU-S-036
  type: script
  title: "정기예금 만기 고객(안전자산 선호형) → 저축은행 정기예금·GIC 재예치"
  segments: [SEG-06]
  trigger: "만기 D-30 & 펀드 이력 없음"
  body: |
    "보유하신 퇴직연금 계좌에 이번 달(다음 달) 만기되는 정기예금이 있으시네요.
    {상품명}이고 금액은 총 {금액}원입니다."
    "정기예금으로만 운용하시는 건 펀드가 변동성도 크고 원금손실 가능성이 있어서 그러시는 거죠?
    그렇다면 원금도 보장되면서 지금보다 금리가 더 높은 정기예금으로 바꿔보시는 건 어떠세요?"
    "저축은행 정기예금이나 이율보증형보험(GIC)은 예금자보호가 되면서도 금리가 더 높습니다.
    현재 {금리}% 수준이라, 안전자산을 선호하시는 고객님께 딱 맞는 상품이에요."
    (만기 전 신청 문의) "네, 가능하세요. 통화 종료 후 만기상품 예약변경을 하실 수 있는
    스타뱅킹 URL을 문자로 보내드리겠습니다. 만기 한 달 전부터 예약거래가 가능하십니다."
