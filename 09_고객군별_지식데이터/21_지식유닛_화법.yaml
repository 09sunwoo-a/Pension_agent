- id: KU-S-032
  type: script
  title: "ISA 만기 고객 → 60일 골든타임 + 추가 세액공제"
  segments: [SEG-05]
  trigger: "ISA 만기 도래 또는 만기해지 후 60일 미경과"
  body: |
    "고객님, ISA 드디어 만기가 되셨네요. 축하드립니다.
    이 목돈 어떻게 사용하실 예정이세요? 당장 사용하실 일이 없으시다면 IRP가 답이에요.
    지금이 골든타임입니다."
    "ISA 만기자금을 IRP에 입금하면 두 가지 혜택이 있어요.
    첫 번째는 세액공제 한도가 늘어납니다. 원래 IRP 세액공제 한도가 연 900만원인데,
    ISA 만기 자금을 넣으시면 전환 금액의 10%(최대 300만원)까지 추가로 한도가 늘어나요.
    결과적으로 올해 최대 1,200만원에 대한 세금을 돌려받으실 수 있습니다."
    "두 번째는 원래 IRP는 연간 1,800만원까지만 넣을 수 있지만,
    ISA 만기 자금은 제한 없이 전액 넣으실 수 있습니다. 일부만 넣으셔도 되고요.
    운용하는 동안 이자에 세금을 떼지 않고 통째로 굴릴 수 있고,
    수익이 나도 종합소득에 합산되지 않으니 건강보험료 오를 걱정도 없어요."
    클로징: "ISA 만기 → IRP 전환 → ISA 재가입, 3년 주기로 이 사이클을 반복하시면 됩니다."
  numbers:
    - {label: "전환 기한", value: "만기일로부터 60일", as_of: "2026.03", verify: false}
    - {label: "추가 공제 한도", value: "전환금액의 10%, 최대 300만원", as_of: "2026.03", verify: true}
    - {label: "합산 공제 한도", value: "최대 1,200만원", as_of: "2026.03", verify: false}
  screens: ["[04-10-099]", "[01-12-213]"]
  cautions:
    - "총급여 구간별 상세값(5,500만원 이하 300만원 / 초과 1,388,000원)과 '최대 300만원' 중 현행 확인 필요"
    - "세액공제 이월은 전환 신청을 별도로 해야 한다"
  source: {doc: "개인형IRP 마케팅 보물지도 Vol.1", section: "3. 추가납 CASE ①", org: "연금컨설팅부", date: "2026.03"}
