- id: KU-S-001
  type: script
  title: "상담 전 태도 — '파는 게 아니라 알려준다는 마음으로'"
  segments: [SEG-01, SEG-02, SEG-03, SEG-04, SEG-05, SEG-06]
  trigger: "모든 접촉 직전 (행원용 내부 지침)"
  body: |
    말투 규칙: "꼭 하셔야 돼요"(압박) ❌ → "요즘 많이 하시더라고요"(정보) ⭕
    상담 프레임: 상품을 파는 자리가 아니라 고객이 모르는 자기 현황을 알려주는 자리.
    고객이 모르는 것을 정리해 보여주는 것이 현장 검증된 최고의 오프너다 —
    "보통 고객들은 본인이 얼마를 납입하고 공제받는지 모르는 경우가 많다."
  numbers: []
