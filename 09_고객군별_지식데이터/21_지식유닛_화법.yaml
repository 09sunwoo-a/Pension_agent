- id: KU-S-013
  type: script
  title: "디폴트옵션 미등록 + 현금성자산 보유 → '동의 + 교체매매' 세트 화법"
  segments: [SEG-02, SEG-03, SEG-06]
  trigger: "디폴트옵션 미등록 & 고유계정대 자금 보유"
  body: |
    "만기가 된 상품이 예전처럼 자동 재예치가 되지 않아서,
    지금 고객님 계좌에 대기 중인 자금 {금액}원이 그대로 남아 있습니다.
    이 자금은 금리 높은 상품으로 바꿔 드리고, 앞으로 돌아오는 만기 자금은
    디폴트옵션으로 등록해 두시면 자동으로 운용됩니다. 두 가지를 오늘 한 번에 해드릴게요."
    거절 대응: "소액이시더라도 디폴트옵션 등록만큼은 꼭 필요하셔서요, 예약만 도와드릴게요."
  numbers: []
  screens: []
  cautions:
