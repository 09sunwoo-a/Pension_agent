    - "⚠ 초저위험 → 저위험 이상 상향은 ⓐ등록변경 → ⓑ보유상품변경 2단계 거래"
  source: {doc: "Hot Tip 9737 / 오늘의할일 시트34", section: "-", org: "부동산사업부(P) / 연금사업부(상품)", date: "2023"}
