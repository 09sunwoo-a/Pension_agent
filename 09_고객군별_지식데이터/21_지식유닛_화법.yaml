- id: KU-S-023
  type: script
  title: "이탈 고객의 적립금에 퇴직금이 있으면 → 인출 설계·골든라이프센터로 2차 방어"
  segments: [SEG-04]
  trigger: "이탈 희망 고객의 적립금에 퇴직금이 포함된 경우"
  body: |
    "퇴직금은 노후 자금이라 금액도 크고, 한 번 결정하면 다시 만들기 쉽지 않습니다.
    그래서 공격적인 투자보다 지키는 전략이 더 중요합니다.
    그리고 많이들 놓치시는데, 투자보다 더 중요한 건 '어떻게 인출하느냐'입니다.
    같은 돈도 어떻게 인출하느냐에 따라 세금이 크게 달라집니다.
    퇴직 이후에는 건강보험료나 종합소득과세 부담도 커질 수 있어서 미리 구조를 점검해 보시는 게 좋습니다.
    이런 부분까지 포함해서 연금 수령, 세금, 보험료까지 상담이 가능한
    골든라이프센터 연결을 도와드릴게요. 한번 상담 받아보세요."
    예약 경로: 영업점 창구 / KB스타뱅킹 「전문가상담 예약」 — 방문·전화·화상 모두 가능,
    고객등급·거주지역·시니어 여부 관계없이 이용 가능.
