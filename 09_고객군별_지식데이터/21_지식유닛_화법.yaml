- id: KU-S-011
  type: script
  title: "현금성자산 방치 고객 → 운용지시·리밸런싱 권유 (Mission 1)"
  segments: [SEG-02, SEG-03]
  trigger: "고유계정대 비중이 높거나 운용지시가 없는 계좌"
  branch:
    - condition: "Step2 통화 목적"
      body: |
        "현재 가입하신 상품 중 {n}% 이상이 현금성자산인 대기 상태로 운용되고 있습니다.
        상품을 선택해서 운용하시면 수익률을 높일 수 있는 방법이 있어 안내해 드릴게요."
    - condition: "Step3 변경 필요 안내"
      body: |
        "현금성자산은 상품을 선택하지 않은 상태이기 때문에 수익률이 낮은 단점이 있어요.
        현금성자산도 {as_of} 기준으로 연 {금리}% 정도의 이자가 붙긴 하지만,
        다른 정기예금이나 펀드에 비해 훨씬 낮은 수준이라 변경하시는 것을 추천드려요."
    - condition: "Step4 대안 제시 — 희망 유형을 묻는다"
