  related: [KU-M-008]

- id: KU-S-002
  type: script
  title: "\"수익률은 다른 은행이 더 좋던데요\" → 공시 근거 + 장기 관리 약속"
  segments: [SEG-01, SEG-04]
  trigger: "고객 발화: 수익률이 타행보다 낮다"
  branch:
    - condition: "당행 공시 순위를 제시할 수 있는 경우"
      body: |
        "고객님, 개인형IRP 실적배당상품 수익률은 {기준분기} 기준으로 저희 KB국민은행이
        은행권 {순위}입니다. 다만 수익률은 어느 상품을 담느냐로 갈리기 때문에,
        지금 고객님 계좌 구성부터 같이 보시는 게 더 정확합니다."
    - condition: "기준분기를 확인하지 못한 경우"
      body: |
        "당행은 실적배당 상품과 디폴트옵션 수익률이 우수한 편입니다.
        수치는 공시 기준으로 정확히 확인해서 말씀드릴게요.
        중요한 건 어디서 가입했느냐보다 어떻게 관리받느냐입니다."
  numbers: []
  screens: []
  cautions:
    - "기준분기 없이 '1위'만 말하지 않는다 (KU-G-005)"
    - "수치를 확신할 수 없으면 정성 표현으로만 말하는 것도 선택지"
  source: {doc: "06_주제별_추출지식/03_영업화법", section: "2번", org: "-", date: "-"}
  origin_ref: "화법 2번 / 팩트 F60·F62"
  trust: 본부공식
  disclosure: 표현변경후
  status: 기준시점병기조건부
  confidence: medium
  related: [KU-E-013, KU-G-005]

- id: KU-S-003
  type: script
  title: "\"그동안 관리 안 해줬잖아요\" → 사과 + 상담 채널 구체 열거"
  segments: [SEG-01, SEG-04]
  trigger: "고객 발화: 관리를 못 받았다 / 은행 다 거기서 거기 아니냐"
  body: |
    "조금 더 세심하게 관리해 드렸어야 했는데 만족스럽지 못하셨다면 죄송합니다.
    지금은 영업점 창구뿐 아니라 퇴직연금 전용 상담센터, KB골든라이프센터 전문가 상담,
    스타뱅킹 「전문가상담 예약」까지 상담 경로가 열려 있습니다.
    오늘 저와 한 번 점검해 보시고, 앞으로는 6개월에 한 번씩 제가 먼저 연락드리겠습니다."
  numbers: []
  screens: ["[04-12-660]"]
  cautions:
    - "'어디서 가입했는가'가 아니라 '어떻게 관리받는가'로 논점을 옮긴다"
    - "약속한 점검 주기는 반드시 후속 예약으로 심는다 — 미이행이 재이탈 사유"
  source: {doc: "06_주제별_추출지식/03_영업화법", section: "3·4번", org: "-", date: "-"}
  origin_ref: "화법 3·4번 / 방법론 109번"
  trust: 본부공식
  disclosure: 대고객가능
  status: 확정
  confidence: high
  related: [KU-M-011, KU-S-022]

- id: KU-S-004
  type: script
  title: "\"생각 좀 해볼게요\" → 시간의 정당성 인정 + 자가확인 경로 남기기"
  segments: [SEG-01, SEG-02, SEG-03, SEG-05, SEG-06]
  trigger: "고객 발화: 생각해 보겠다 / 나중에 하겠다"
  body: |
    "네, 큰돈이니 바로 결정하실 일은 아니죠. 편하실 때 보시라고 요약자료만 문자로 보내드릴게요.
    스타뱅킹에서도 지금 구성과 금리를 직접 확인하실 수 있고요.
    {기한이벤트}는 {날짜}까지라, 그 전에 제가 한 번 더 연락드리겠습니다."
  numbers: []
  screens: ["[75-08-110]"]
  cautions:
    - "발송은 '동의 고객 + 동의 채널'에만 (KU-P-004)"
  source: {doc: "06_주제별_추출지식/03_영업화법", section: "19·62번", org: "-", date: "-"}
  origin_ref: "화법 19번 / 절차 62번"
  trust: 본부공식
  disclosure: 대고객가능
  status: 확정
  confidence: high
  related: [KU-P-004]

- id: KU-S-005
  type: script
  title: "TM 통화의 4단계 골격과 Mission 4-Step"
  segments: [SEG-01, SEG-02, SEG-03, SEG-05, SEG-06]
  trigger: "전화 접촉의 전체 골격이 필요할 때"
  body: |
    본부 최신(Series1) Mission 4-Step:
    Step1 인사·본인 확인 → Step2 통화 목적 안내 → Step3 현재 상태 설명(수치 제시)
    → Step4 상품 운용 대안 제시(희망 유형을 물어 분기)
    바쁘다는 반응에는 시간을 명시해 되묻는다:
    "3분이면 가능한데, 혹시 어려우실까요?" (정확한 시간 제시로 고객 시간 보호)
  numbers: []
  screens: []
  cautions: []
  source: {doc: "개인형IRP 고객관리 가이드 Series 1 / 오늘의할일 스크립트", section: "Mission 1~2", org: "연금컨설팅부", date: "2026.05"}
  origin_ref: "화법 39·40번"
  trust: 본부공식
  disclosure: 사내전용
  status: 확정
  confidence: high
  related: [KU-S-011]

- id: KU-S-006
  type: script
  title: "전액 원리금보장 · 수익률 불만 고객 → 원인은 구성이라고 짚고 일부 전환"
  segments: [SEG-01, SEG-02]
  trigger: "수익률 불만 + 전액 원리금보장상품 보유"
  body: |
    "고객님은 정기예금 중심으로 안정적인 투자를 하셨는데요.
    예금 금리와 물가상승률을 감안하면 일부 자금은 고객님 성향에 적합한 펀드 상품으로
    운용하시는 게 좋습니다.
    당행은 실적배당 상품과 디폴트옵션 수익률이 우수한 편인데요,
    지금부터는 저희가 추천하는 상품으로 연금 자산관리를 해보시는 건 어떨까요?"
    (전체 자산의 30% 정도만이라도 — 라고 규모를 먼저 낮춰 제시)
  numbers: []
  screens: []
  cautions:
    - "'수익률이 낮다'고 지적하지 않는다 — 원인을 구성 문제로 돌린다"
    - "비대면 통화에서 특정 펀드명을 권유하지 않는다 (금소법, KU-G-003)"
  source: {doc: "스타런 교육영상 수익률불만·자산관리미흡 이탈대응 / Hot Tip 204309", section: "-", org: "연금사업부 / 성산동종합금융센터", date: "2024~2026"}
  origin_ref: "화법 63번 / SEG 36-1·43번"
  trust: 본부공식
  disclosure: 표현변경후
  status: 확정
  confidence: high
  related: [KU-M-009, KU-G-003]

- id: KU-S-007
  type: script
  title: "성과저조·판매중단 펀드 보유 고객 → 감정 인정 후 교체 권유"
  segments: [SEG-01]
  trigger: "환매추천·판매중단 펀드 보유가 확인됐을 때"
  body: |
    "고객님 계좌에 {상품명}을 운용하고 계신데, 이 상품은 현재 성과가 좋지 않아
    신규 판매가 중단된 상품입니다. 이런 경우 운용사의 관리가 소홀해질 수 있어
    향후 수익률 개선도 다른 상품 대비 어려울 수 있습니다.
    많이 속상하시겠지만, 안정적인 연금 자산관리를 위해 최근 수익률을 비교해 보시고
    상대적으로 성과가 우수한 상품으로 변경해 보시는 건 어떠신가요?"
  numbers: []
  screens: []
  cautions:
    - "'속상하시겠지만'이라는 감정 인정을 반드시 앞세운다"
    - "수익률을 단정하지 말고 '운용 여건의 차이'로 설명한다 (화법 14번)"
  source: {doc: "연금고객 수익률 KPI 고객관리 시나리오 / 오늘의할일 시트31", section: "해피콜", org: "-", date: "2021~2024"}
  origin_ref: "화법 27번"
  trust: 본부공식
  disclosure: 표현변경후
  status: 확정
  confidence: high
  related: [KU-M-010]

- id: KU-S-008
  type: script
  title: "수익률 하위 고객 → 지적 없이 비교그룹 대조로 여는 민감 응대"
  segments: [SEG-01]
  trigger: "수익률 하위 고객에게 처음 말을 걸 때"
  branch:
    - condition: "오프너 (공통)"
      body: |
        "고객님의 퇴직연금 전담직원으로 인사드리고 정기적인 상품 관리를 해 드리고자 연락드렸습니다.
        퇴직연금을 운용하시면서 혹시 궁금하시거나 상담하고 싶으신 내용이 있으신지요?"
    - condition: "펀드 보유 고객"
      body: |
        "최근 시장이 불안해서 펀드 수익률이 전체적으로 좋지 않습니다.
        시장이 회복할 거라 보고 꾸준히 유지하시는 분들도 많으시고요.
        다만 가지고 계신 상품의 수익률이 상대적으로 좋지 않다고 판단되시면
        추천 상품으로 교체매매 해 보시는 것도 좋은 방법이라고 생각합니다."
    - condition: "펀드 미보유 고객"
      body: |
        "고객님과 비슷한 연령대의 많은 분들이 펀드를 포트폴리오에 일부 편입해 운용하고 계세요.
        변동성이 크고 원금손실 위험도 있지만, 고객님 투자성향에 맞게 일부 금액을 운용해 보시면
        시장이 좋을 때 더 큰 기대수익을 달성하실 수 있습니다."
  numbers: []
  screens: ["[06-12-631]"]
  cautions:
    - "수익률이 저조한 고객은 상담에 민감하다 — 개선방안을 준비한 뒤 접촉한다"
    - "비대면 통화에서 특정 펀드를 언급하지 않는다 (금소법)"
  source: {doc: "연금고객 수익률 KPI 고객관리 시나리오", section: "해피콜 — 수익률 하위 고객", org: "-", date: "2021 추정"}
  origin_ref: "화법 28번 / 방법론 4번"
  trust: 본부공식
  disclosure: 표현변경후
  status: 확정
  confidence: high
  related: [KU-M-002, KU-G-001, KU-G-003]

- id: KU-S-009
  type: script
  title: "저금리에 안주하는 고객 → 72의 법칙으로 '두 배 되는 데 몇 년'"
  segments: [SEG-01, SEG-02]
  trigger: "고객 발화: 연 3%면 충분하다 / 안전하게만 하고 싶다"
  body: |
    "72를 수익률로 나누면 원금이 두 배 되는 기간이 나옵니다.
    연 3%면 24년, 연 6%면 12년입니다.
    고객님 연금은 앞으로 {n}년을 가져가실 자금인데,
    3%로만 두시면 은퇴 시점에 두 배가 될까 말까 합니다."
    보조 논거: 국민연금 6.21% vs 퇴직연금 5년 2.35% — 차이는 상품 선택에서 왔다.
  numbers:
    - {label: "72의 법칙 예시", value: "연 3% → 24년 / 연 6% → 12년", as_of: "-", verify: false}
  screens: []
  cautions:
    - "국민연금·퇴직연금 수익률 비교는 기준연도(2023)를 병기"
    - "미래 수익률을 단정하지 않는다 (KU-G-005)"
  source: {doc: "06_주제별_추출지식/03_영업화법", section: "88·90번", org: "-", date: "-"}
  origin_ref: "화법 88·90번 / 방법론 64번"
  trust: 본부공식
  disclosure: 표현변경후
  status: 확정
  confidence: high
  related: [KU-E-012]

- id: KU-S-010
  type: script
  title: "수익률에 일희일비하는 고객 → 모니터링 주기 안내"
  segments: [SEG-01]
  trigger: "고객이 매일 수익률을 확인하며 불안해할 때"
  body: |
    "매일 보지 마세요. 연금은 최소 15년을 가져가는 자금이라
    하루하루 등락은 결과에 거의 영향이 없습니다.
    6개월이나 1년에 한 번 점검하시면 충분하고, 그 점검은 제가 챙겨서 연락드리겠습니다."
  numbers: []
