- id: KU-S-030
  type: script
  title: "절세 관심 고객 → 연 1,800만원 한도까지 채우기"
  segments: [SEG-05]
  trigger: "세액공제 구간(900만원)을 넘겨 여유가 있는 고객 / 금융소득종합과세 대상자"
  body: |
    "요즘 자산 관리에 밝은 분들은 IRP 세액공제 한도인 900만원만 채우지 않고,
    연간 최대 납입 한도인 1,800만원을 꽉 채우시는 경우가 정말 많습니다.
    당장 세액공제를 못 받는 나머지 900만원에 대해서도 '과세 이연' 혜택이 있잖아요.
    IRP에서 운용하면 세금까지 재투자되어 복리 효과를 온전히 누릴 수 있어요.
    나중에 연금으로 수령하실 때는 세액공제 받지 않은 적립금에 대해서는 과세하지 않으니
    이 부분도 걱정하지 않으셔도 됩니다."
    "올해 1,800만원을 입금했는데 내년에 자금 사정이 여의치 않다면,
    올해 더 넣은 돈을 내년 세액공제분으로 신청할 수도 있어요."
    (금융소득종합과세 대상자) "IRP 계좌 안에서 발생하는 이자·배당소득은
    금융소득종합과세 대상에서 제외됩니다."
  numbers:
