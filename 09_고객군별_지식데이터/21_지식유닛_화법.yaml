- id: KU-S-038
  type: script
  title: "만기 임박 + 디폴트옵션 미등록 → 재예치 폐지를 근거로 사전지정 등록"
  segments: [SEG-06, SEG-03]
  trigger: "1개월 내 만기도래 & 디폴트옵션 미등록"
  body: |
    "고객님, 2023년 7월 법 개정으로 디폴트옵션 제도가 시행되면서
    기존과 같은 정기예금 자동 재예치 제도가 폐지되었습니다.
    따라서 만기 도래 예정인 정기예금(GIC, ELB)에 별도 운용지시를 하지 않으시면,
    만기자금은 대기 중인 현금성자산으로 상환됩니다.
    디폴트옵션(저위험 이상) 사전지정 등록을 하시어 연금자산을 운용해 보시는 건 어떨까요?"
    (비대면 실행) "KB스타뱅킹으로 연금상품을 관리해 보신 적 있으실까요?
    디폴트옵션 등록(또는 만기 예약변경) 링크를 발송해 드리겠습니다."
    (내점 희망) "그러시면 방문 가능하신 날짜가 있으실까요? 상담예약을 도와드리겠습니다."
  numbers: []
