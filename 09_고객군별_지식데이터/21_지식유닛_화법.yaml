- id: KU-S-012
  type: script
  title: "분산투자 가능형 → 일부 금액의 추천펀드·TDF 운용 권유"
  segments: [SEG-02, SEG-06]
  trigger: "펀드 이력이 있는 고객에게 실적배당 전환을 제안할 때"
  body: |
    "만기 후 펀드 같은 상품을 일부 운용해 보시는 건 어떻게 생각하세요?
    지금 시장이 불안정하고 손실 날 가능성도 있지만, 일부 금액을 포트폴리오 차원으로 운용하시면
    정기예금으로만 운용하실 때보다 높은 수익률을 기대하실 수 있어요.
    퇴직연금은 은퇴 후 사용할 자산이니 좀 더 길게 보시고 포트폴리오로 운용해 보시는 게 좋을 것 같습니다."
    실행 안내: "통화 종료 후 만기상품 예약변경을 하실 수 있는 스타뱅킹 URL을 문자로 보내드릴게요.
    상품 검색에서 'TDF' 또는 '추천상품' 테마로 들어가시면 관련 상품을 찾으실 수 있습니다."
  numbers: []
  screens: ["[75-08-110]"]
  cautions:
    - "손실 가능성을 먼저 인정하고 시작한다"
    - "특정 펀드명 대신 테마(추천상품·TDF)로 안내 — 금소법"
  source: {doc: "연금고객 수익률 KPI 고객관리 시나리오", section: "유형2 분산투자 가능고객", org: "-", date: "2021 추정"}
