- id: KU-S-027
  type: script
  title: "이탈방어 클로징 — 성공/실패별 멘트와 취소 경로"
  segments: [SEG-04]
  trigger: "이탈방어 통화의 마무리"
  branch:
    - condition: "방어 성공 — 직원 처리"
      body: "\"고객님, 지금 바로 제가 계좌이전 취소 처리 도와드릴게요.\""
    - condition: "방어 성공 — 고객 직접 처리 ①"
      body: |
        "지금 바쁘시면 이 방법 안내드릴게요. 이전에 대한 최종 의사 확인을 위해
        오늘 오후 6시 이후 순차적으로 Link가 카카오톡으로 발송될 예정입니다.
        카카오톡 알림톡을 받으시면 [이전의사확인 바로가기]를 누르신 후
        [이전 미동의]를 꼭 선택해 주세요."
    - condition: "방어 성공 — 고객 직접 처리 ②"
      body: "\"스타뱅킹이 익숙하시면 직접 스타뱅킹에서 이전 신청을 취소하실 수 있습니다.\""
    - condition: "방어 실패"
      body: |
        "네, 고객님 말씀 감사합니다. 최종 의사확인을 위해 1차로 오늘 오후 6시 이후
        Link가 발송되고, 당일 미응답 시 2차로 내일 10시와 14시에 AI콜봇 통화가 진행됩니다.
        확인기한 내 의사가 확인되지 않으면 계좌이체는 자동으로 취소됩니다.
        추후 궁금하신 점 있으시면 언제든 연락 주세요.
        언제든 다시 찾아주시면 더 잘 관리해 드리겠습니다. 감사합니다."
