- id: KU-S-024
  type: script
  title: "VIP 고객의 타행 이전 → 등급 인정 → 경청 → 사과 → 1:1 상담 → 결정 유보"
  segments: [SEG-04]
  trigger: "KB스타클럽 VIP·그랜드 이상 등급 고객이 이전 의사를 밝혔을 때"
  body: |
    "고객님은 저희 KB국민은행의 VIP 고객님입니다.
    퇴직연금을 관리하면서 어떤 어려움이 있으셨나요?"
    (수익률 관리 불만인 경우)
    "조금 더 세심하게 수익률 관리를 했어야 했는데 만족 못 하셨다면 죄송합니다.
    당행은 퇴직연금 자산관리의 중요성을 감안해 자산관리 1:1 상담 서비스를 운영하고 있습니다.
    퇴직연금 자산관리 상담부터 연금 수령 등 종합적인 노후 설계 서비스를 제공하고 있어요.
    고객님께서도 한 번 통화를 해보시고 퇴직연금 이전을 결정하시면 어떨까요?"
    추가 논거: 퇴직연금은 스타클럽 등급 산정에 큰 영향을 미쳐, 등급 유지 측면에서도 계약 유지가 중요하다.
  numbers: []
  screens: []
  cautions:
