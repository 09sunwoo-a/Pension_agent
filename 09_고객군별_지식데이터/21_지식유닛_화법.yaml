- id: KU-S-020
  type: script
  title: "\"증권사는 수수료 무료라는데요\" → 조건 분기 후 면제 카드, 그 다음 프레임 전환"
  segments: [SEG-04]
  trigger: "고객 발화: 증권사는 IRP 수수료가 무료다"
  branch:
    - condition: "만 55세 이상"
      body: "\"고객님, 연금 수령 개시하시면 운용·자산관리 수수료가 면제됩니다.\""
    - condition: "퇴직금 5천만원 이상 보유"
      body: "\"비대면 계좌로 전환하시면, 퇴직금에 대한 수수료가 면제됩니다.\""
    - condition: "그 외"
      body: |
        "2025년 10월부터 대면 계좌를 비대면 계좌로 전환할 수 있게 되었어요.
        지금 전환하시면 현재 수수료 {n}%에서 {n}%로 낮아지십니다.
        개인형IRP 수수료는 매년 신규하신 날에 후취로 나가기 때문에,
        지금 전환하시면 {날짜}(신규일) 이후 발생한 수수료부터 혜택을 누리실 수 있습니다."
    - condition: "연금개시 계획이 없는 만 55세 이상"
      body: |
        "당장 연금을 수령하실 계획이 아니시라면, 수시인출로 등록해 두시고
        매년 1회 10만원 이상만 인출하셔도 수수료가 전부 면제됩니다."
    - condition: "그래도 수수료가 발생하는 경우 — 프레임 전환"
      body: |
        "네, 일부 발생합니다. 그런데 IRP는 수수료만 보고 결정하기엔 아까운 계좌입니다.
        증권사는 고객님이 장기간 직접 투자하고 직접 관리하셔야 하는 반면,
        저희는 가까운 영업점 어디에서든 포트폴리오 점검과 리밸런싱 상담이 가능합니다."
  numbers: []
  screens: ["[04-12-613]"]
  cautions:
    - "⚠ 사전 고지: 전환 적용은 전환일 다음날 이후 첫 수수료 납입일부터"
    - "타사 수수료 체계에 대한 주장(장기할인 소멸 등)은 사실 확인 후, 비방으로 읽히지 않게 (KU-G-009)"
    - "수수료율 수치는 자료별로 4갈래 — 대고객 표준은 KBthink 공개 기준 (KU-F-010)"
  source: {doc: "보물지도 Step05 / 마스터북 2주차 / 스타런 교육영상 / Hot Tip 204696·198898", section: "-", org: "복수", date: "2025~2026"}
