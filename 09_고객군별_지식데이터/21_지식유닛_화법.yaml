- id: KU-S-033
  type: script
  title: "퇴직금을 통장으로 받은 고객 → 60일 내 IRP 입금(퇴직소득세 환급)"
  segments: [SEG-05]
  trigger: "입출금통장으로 퇴직금이 입금된 고객"
  body: |
    "고객님, 저희 지점 입출금통장으로 퇴직금이 입금되어 개인형IRP 안내차 연락드렸습니다.
    통장으로 받으신 금액은 퇴직금에서 퇴직소득세를 떼고 들어온 금액이에요.
    나라에 먼저 세금을 내고 받으신 셈인데, 이게 사실 좀 아까워요.
    개인형IRP로 받으시면 퇴직소득세를 떼지 않고 들어오거든요."
    "지금이라도 이 돈을 개인형IRP 계좌로 옮기시면, 이미 내셨던 세금을 100% 돌려받으실 수 있습니다.
    세금을 포함해서 전체 금액을 그대로 굴릴 수 있으니, 그 세금만큼의 돈이 이자를 더 불려주는
    효자 역할을 하게 됩니다."
    (금액 예시) "통장으로 받으신 퇴직금 2,400만원에 차감된 퇴직소득세 600만원을 환급받아
    3,000만원으로 운용한다고 해볼게요. 연 4% 정기예금을 2,400만원으로 넣으시면 연 96만원 이자인데,
    환급받아 3,000만원으로 운용하시면 연 120만원입니다. 연 24만원을 더 받으시는 거죠."
    (만 55세 이상) "만 55세가 넘으셨다면 퇴직금은 개인형IRP로 받으셔야 해요.
    IRP를 거쳐만 가도 올해 연금수령한도만큼은 퇴직소득세를 30% 저렴하게 납부하실 수 있습니다."
    (건강보험료) "일반 계좌의 금융소득은 건강보험료 산정에 바로 포함되지만,
    IRP 안에서 운용되는 수익은 연금 수령 전까지 소득으로 잡히지 않습니다."
  numbers:
    - {label: "환급 기한", value: "지급일로부터 60일", as_of: "2026.03", verify: false}
    - {label: "예시 금액", value: "2,400만원 → 3,000만원 · 연 24만원 추가 이자", as_of: "-", verify: false}
  screens: ["[06-12-501]", "[02-12-221]"]
  cautions:
    - "예시 수치는 마케팅 가정치 — 실제 상담에서는 [02-12-221]로 개별 계산"
    - "60일 이내면 이미 일시금으로 받은 뒤에도, 일부 금액만으로도 가능하다"
  source: {doc: "개인형IRP 마케팅 보물지도 Vol.1 / 마스터북 2주차", section: "4. 퇴직금 CASE ①", org: "연금컨설팅부", date: "2026"}
  origin_ref: "화법 32번 / 방법론 27번 / 절차 41·46번"
  trust: 본부공식
  disclosure: 대고객가능
  status: 확정
  confidence: high
  related: [KU-F-016, KU-E-009]

