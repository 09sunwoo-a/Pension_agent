    Step2: "현재 가입하신 상품보다 수익률이 높은 상품을 안내드리고자 연락드렸어요."
    Step3: "현재 고객님께서는 현금성자산과 시중은행 정기예금만 보유하고 계세요.
    안정적인 상품으로 잘 운용하고 계신데, 해당 상품보다 더 높은 수익률을 드릴 수 있는 상품이 있어
