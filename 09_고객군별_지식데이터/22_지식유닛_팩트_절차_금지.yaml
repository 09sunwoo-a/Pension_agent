- id: KU-G-003
  type: guardrail
  title: "비대면(전화·문자)에서 특정 펀드를 권유하지 않는다 — 금소법"
  segments: [SEG-01, SEG-02, SEG-06]
  trigger: "전화·문자로 실적배당 상품을 안내할 때"
  body: |
    금지: 통화·문자에서 특정 펀드상품명을 언급한 권유.
    이유: 금융소비자보호법 위반 소지 — 은행은 투자중개업 라이선스가 없어 완전판매 프로세스를 적용받는다.
