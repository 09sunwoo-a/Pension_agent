- id: KU-F-003
  type: fact
  title: "원리금보장상품 특성 — GIC / ELB·DLB"
  segments: [SEG-02, SEG-06]
  trigger: "재예치 상품을 비교 설명할 때"
  body: |
    GIC(이율보증형보험)는 보험사가 확정이율을 보증하는 상품으로,
    일반 정기예금 대비 금리가 높은 경우가 많고 예금자보호 대상이다.
    ELB·DLB는 원금보장형 파생결합사채로 조건에 따라 수익률이 달라진다.
    당행 특별제공상품은 주로 GIC(3년제)와 저축은행 정기예금으로 구성된다.
  numbers: []
  screens: ["[04-12-17A]"]
  cautions: ["원리금보장상품은 상담 전 잔여한도를 반드시 확인"]
  source: {doc: "06_주제별_추출지식/04_제도상품팩트", section: "F23", org: "-", date: "2026"}
  origin_ref: "팩트 F23"
