- id: KU-F-006
  type: fact
  title: "정기예금 자동 재예치 폐지 (2023.7) — 만기 후 현금성자산으로 상환"
  segments: [SEG-06, SEG-03]
  trigger: "만기 안내의 근거를 제시할 때"
  body: |
    2023년 7월 근로자퇴직급여보장법 개정으로 디폴트옵션이 시행되면서
    퇴직연금 내 정기예금의 자동 재예치 제도가 폐지됐다.
    만기 시 재운용 지시가 없으면 만기자금은 대기 중인 현금성자산으로 상환되고,
    디폴트옵션이 등록돼 있으면 유예기간 후 디폴트옵션으로 운용된다.
  numbers:
    - {label: "시행일", value: "2023.07.12", as_of: "2023", verify: false}
  screens: []
  cautions: ["'이제 시행되었습니다'류 도입기 표현은 실효"]
  source: {doc: "오늘의할일 시트34 / KB Think", section: "F18", org: "-", date: "2023~2026"}
