- id: KU-F-004
  type: fact
  title: "디폴트옵션 적용 유예기간 — 신규 입금 2주 / 만기 후 6주(4+2주) / 옵트인 즉시"
  segments: [SEG-03, SEG-06]
  trigger: "미조치 판정 전 상태 확인 / 고객에게 적용 시점을 안내할 때"
