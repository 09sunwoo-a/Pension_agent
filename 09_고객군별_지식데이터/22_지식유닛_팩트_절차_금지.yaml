  trigger: "고객에게 상품변경 URL을 발송할 때"
  body: |
    URL로 상품변경을 하면 발송한 직원의 이름·점코드가 자동 입력되지 않는다.
    고객이 관리희망부점과 직원명을 수기로 입력해야 실적이 인정된다.
    발송 시 이 안내를 반드시 함께 한다. 미입력 시 정정 화면은 [06-12-625].
    비대면계좌 전환은 '변경 전 계좌가 대면계좌'면 대상이며,
    변경일 다음날부터 첫 도래 수수료 납입일에 적용된다.
  numbers: []
  screens: ["[06-12-625]", "[75-08-110]"]
  cautions:
    - "⚠ 이 안내를 빠뜨리면 처리는 되고 실적만 사라진다"
  source: {doc: "Hot Tip 207754 / 05_업무처리절차", section: "25·26번", org: "영등포하이테크종합금융센터", date: "2026.08"}
