- id: KU-F-005
  type: fact
  title: "디폴트옵션 제도 개요 — 위험등급 4단계·포트폴리오 10종·성향 대응"
  segments: [SEG-03]
  trigger: "디폴트옵션이 무엇인지 설명을 요구받을 때"
  body: |
    가입자가 별도의 운용지시를 하지 않는 경우 사전에 정해둔 방법으로 퇴직연금을 운용하는 제도.
    위험등급은 초저위험 / 저위험 / 중위험 / 고위험 4단계이며,
    당행 포트폴리오는 10종(예금 / 예금+TDF / TDF 100% 구성)으로 투자성향별 가입 가능 등급이 정해진다.
    초저위험은 정기예금만으로 구성된다.
  numbers:
