    ① 신규 입금 후 2주간 운용지시가 없으면 적용
    ② 기존 상품 만기 후 6주 — 만기일부터 4주간 지시 없으면 가입자 안내 후 2주 뒤 적용
    ③ 옵트인(Opt-In) — 대기 기간 없이 즉시 운용. 단 이미 디폴트옵션 운용 중이면 같은 상품으로만 가능
