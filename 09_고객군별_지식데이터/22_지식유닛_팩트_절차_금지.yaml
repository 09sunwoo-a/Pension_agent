- id: KU-F-009
  type: fact
  title: "TDF — 빈티지 선택 공식과 글라이드 패스"
  segments: [SEG-06, SEG-02]
  trigger: "TDF를 제안할 때"
  body: |
    TDF는 상품을 고르는 게 아니라 은퇴 연도를 계산하는 상품이다.
    빈티지 = 고객의 은퇴 예상 연도. 숫자가 클수록 주식 비중이 높고,
    은퇴 시점이 가까워질수록 자동으로 위험자산 비중이 줄어든다(글라이드 패스).
    헤지형·언헤지형 선택도 함께 안내한다.
    오프너 한 문장: "은퇴가 언제쯤이세요?"
  numbers:
    - {label: "라인업", value: "18종", as_of: "2026", verify: true}
  screens: ["[04-12-17A]"]
  cautions:
    - "과거 자료의 예시 빈티지(2015-2025 등)를 그대로 쓰지 않고 고객 은퇴시점으로 재산정"
    - "연금으로 나눠 받을 고객은 투자가능기간을 '연금 수령 종료 시점'까지 다시 계산"
  source: {doc: "06_주제별_추출지식/04_제도상품팩트", section: "F15", org: "-", date: "2026"}
  origin_ref: "팩트 F15 / 방법론 11·61·68번"
  trust: 본부공식
  disclosure: 대고객가능
  status: 확정
  confidence: high
  related: [KU-S-037]

- id: KU-F-010
  type: fact
  title: "수수료 — 요율 구간과 면제·인하 3분기"
  segments: [SEG-04]
  trigger: "수수료 불만에 숫자로 답해야 할 때"
  body: |
    대고객 표준(KBthink 공개 기준): 사용자부담금 연 0%~0.45% / 가입자부담금 연 0.21%~0.28%.
    면제·인하 카드 3분기:
    ① 만 55세 이상 + 연금 수령 개시 → 운용·자산관리 수수료 면제
    ② 퇴직금 5천만원 이상 + 비대면 계좌 → 연금개시 전에도 면제
    ③ 그 외 → 대면 계좌를 비대면으로 전환 시 인하 (2025.10부터 가능)
    부과 방식: 매년 후취. 대면→비대면 전환 시 전환일 다음날 이후 첫 납입일부터 적용.
    조회: [04-12-613] 수수료 예상조회로 현재·전환 후 수수료를 숫자로 확보.
  numbers:
