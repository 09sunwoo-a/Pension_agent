- id: KU-F-007
  type: fact
  title: "위험자산 70% 한도 — 범위·초과 시 조치·예외"
  segments: [SEG-02, SEG-06]
  trigger: "실적배당 비중을 올릴 때 / 한도 초과 계좌를 발견했을 때"
  body: |
    위험자산은 전체 적립금의 70%까지 보유할 수 있다.
    초과 시 해소 방법은 두 가지뿐 — ① 안전자산 교체매매 ② 추가입금 후 안전자산 운용지시.
    예외: 적격TDF·디폴트옵션은 100% 운용 가능.
    70% 한도 안에서 실질 주식비중은 최대 약 94%까지 구성할 수 있다.
    확인: [04-12-354] 컴플라이언스 위반점검 현황조회 → 조회구분 '위험자산투자한도위반'
    (고객명·위반기준일·위반일수·한도초과상품·초과금액·보유가능금액 확인)
  numbers:
    - {label: "위험자산 한도", value: "70%", as_of: "2026", verify: false}
  screens: ["[04-12-354]"]
  cautions: ["위반일수 데이터로 방치 기간 기준 우선순위를 매길 수 있다"]
  source: {doc: "06_주제별_추출지식/04_제도상품팩트 / Hot Tip 205618", section: "F12·F13·F14", org: "-", date: "2026.04"}
