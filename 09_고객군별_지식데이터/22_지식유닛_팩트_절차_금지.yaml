    2024년 10월 말 시행. 동일 제도·동일 상품일 때만 실물 그대로 이전되고,
    사업자 단독 제공 상품은 현금화된다.
    타사 보유 상품과 당행 라인업 대조는 [04-12-333]에서 신청 전에 한다.
    타행 디폴트옵션은 사전 해지해야 이전된다.
    신청이 곧 확정이 아니며 「본인 의사확인」에서 고객이 최종 결정한다.
  numbers:
