# ============================================================
# 30_시나리오.yaml — 고객군별 케이스 시나리오
# 규격: 00_스키마.md § 3
# 원칙: 분기 조건은 반드시 '고객에게 물을 질문'으로 뒤집어 적는다
# ============================================================

meta:
  version: "1.0"
  as_of: "2026-08-23"
  count: 19
  note: |
    시나리오는 '한 고객군 안에서 고객 상태·응답에 따라 갈리는 경로'다.
    turns의 say는 지식유닛 ID를 가리키며, 본문은 21_지식유닛_화법.yaml에만 존재한다.

scenarios:

# ══════════ SEG-01 수익률 저조 ══════════
- id: SC-01-A
  segment: SEG-01
  name: "수익률 저조 · 전액 원리금보장 — 원인은 구성이다"
  entry_condition:
    - {field: 원리금보장상품_비중, op: "==", value: 1.00}
    - {field: 계좌_1년수익률, op: "<", value: "당행 IRP 평균 - 5%p"}
  qualifying_questions:
    - ask: "퇴직연금 운용하시면서 궁금하시거나 상담하고 싶으신 내용이 있으신지요?"
      branches: ["없다 → 전담직원 인사 프레임 유지", "수익이 안 난다 → 원인 설명으로 바로 진입"]
    - ask: "예금 말고 펀드 같은 상품은 해보신 적 있으세요?"
      branches: ["없다 → 안전자산 선호형, 규모를 30%로 낮춰 제안", "있다 → 분산투자 가능형, 포트폴리오 제안"]
    - ask: "이 자금은 몇 년쯤 뒤에 쓰실 계획이세요?"
      branches: ["10년 이상 → 장기 프레임 사용", "5년 이내·인출 예정 → 투자상품 권유 중단, 인출 설계로 전환"]
  turns:
    - {step: 1, actor: 행원, say: KU-S-017, purpose: "중립적 용건으로 문 열기"}
    - {step: 2, actor: 행원, say: KU-S-008, purpose: "시장 상황으로 개인 실패감 완화 (지적 금지)"}
    - {step: 3, actor: 행원, say: KU-M-002, purpose: "동일 연령대 상위 고객 운용현황 대조 — 근거 제시"}
    - {step: 4, actor: 행원, say: KU-S-006, purpose: "저수익 원인을 '구성'으로 규정 + 일부 전환 제안"}
    - {step: 5, actor: 행원, say: KU-S-016, purpose: "규모를 낮춰 닫기 (일부만 + 되돌릴 수 있음)"}
  objection_cards: [KU-S-002, KU-S-003, KU-S-009]
  success_action:
    cart_items: ["원리금보장 일부(30% 또는 500만~1천만원) → 추천펀드·TDF 전환"]
    procedure_ku: [KU-P-002, KU-P-003]
    memo_template: "수익률 {n}% · 원인(전액 원리금보장) 안내, {금액}원 실적배당 전환 합의. 6개월 뒤 재점검 약속."
  partial_action:
    cart_items: ["금액을 더 줄여 재제안 / 내점 상담 예약"]
    note: "비대면에서 특정 펀드를 말할 수 없으므로 상품 선택은 내점 또는 앱으로 넘긴다"
  fail_action:
    say: KU-S-004
    followup: "3개월 뒤 또는 다음 만기 시점 재접촉 예약"
  prohibited: [KU-G-001, KU-G-003, KU-G-005, KU-G-002]
  expected_conversion: null

- id: SC-01-B
  segment: SEG-01
  name: "수익률 저조 · 부진 펀드 보유 — 사과하고 갈아탄다"
  entry_condition:
    - {field: 환매추천펀드_해당여부, op: "==", value: true}
  qualifying_questions:
    - ask: "지금 보유하신 상품, 언제쯤 가입하신 건지 기억나세요?"
      branches: ["오래됨 → 판매중단·운용 여건 변화 설명", "최근 → 시장 요인 설명 후 유지 검토"]
    - ask: "지금 매도하시면 손실이 확정되는데, 그래도 갈아타는 게 나을지 같이 보실까요?"
      branches: ["동의 → 교체 진행", "거부 → 일부만 교체 재제안"]
  turns:
    - {step: 1, actor: 행원, say: KU-S-017, purpose: "중립적 오프너"}
    - {step: 2, actor: 행원, say: KU-S-007, purpose: "감정 인정 → 판매중단 사유 → 교체 권유"}
    - {step: 3, actor: 행원, say: KU-S-022, purpose: "관리 미흡 사과 + 매도·재추천이라는 구체 액션"}
    - {step: 4, actor: 행원, say: KU-S-016, purpose: "일부만 먼저로 닫기"}
  objection_cards: [KU-S-002, KU-S-003]
  success_action:
    cart_items: ["부진 펀드 매도", "대체 상품 매수 (내점 또는 앱)"]
    procedure_ku: [KU-P-002, KU-P-003]
    memo_template: "환매추천펀드 {상품명} 보유 안내, 매도·교체 합의. 대체 상품은 {경로}로 선택 예정."
  partial_action:
    cart_items: ["매도만 합의, 매수는 보류 → 현금성자산 방치 위험 경고 필요"]
    note: "매도만 하고 끝나면 SEG-02(편중)로 전이된다 — 반드시 매수까지 세트로"
  fail_action:
    say: KU-S-004
    followup: "다음 분기 환매추천 목록 갱신 시 재확인"
  prohibited: [KU-G-001, KU-G-003, KU-G-005]
  expected_conversion: null

- id: SC-01-C
  segment: SEG-01
  name: "수익률 저조 · '안전하게만' 고수 고객 — 숫자로 기회비용을 보인다"
  entry_condition:
    - {field: 투자성향, op: in, value: ["안정형", "안정추구형"]}
    - {field: 계좌_1년수익률, op: "<", value: "정기예금 평균"}
  qualifying_questions:
    - ask: "지금 이 자금, 앞으로 몇 년을 더 가져가실까요?"
      branches: ["15년 이상 → 72의 법칙·장기 프레임", "5년 이내 → 안전자산 내 금리 상향으로만 제안"]
    - ask: "원금이 줄어드는 게 걱정이신 거죠?"
      branches: ["그렇다 → 원리금보장 내 금리 상향(SEG-06 트랙)", "아니다, 잘 몰라서 → 상품 설명 후 소액 제안"]
  turns:
    - {step: 1, actor: 행원, say: KU-S-017, purpose: "오프너"}
    - {step: 2, actor: 행원, say: KU-E-011, purpose: "세 기준선 격차를 금액으로 환산해 제시"}
    - {step: 3, actor: 행원, say: KU-S-009, purpose: "72의 법칙 — '두 배 되는 데 몇 년'"}
    - {step: 4, actor: 행원, say: KU-S-016, purpose: "소액·가역 클로징"}
  objection_cards: [KU-S-009, KU-S-015, KU-S-002]
  success_action:
    cart_items: ["일부 전환 또는 고금리 원리금보장 상품 교체"]
    procedure_ku: [KU-P-002]
    memo_template: "기준선 격차 {n}%p 안내, {금액}원 전환 합의."
  partial_action:
    cart_items: ["안전자산 내 금리 상향만 합의 → SEG-06 트랙으로 연결"]
  fail_action:
    say: KU-S-010
    followup: "6개월 뒤 수익률 점검 예약 — 관계 유지가 목표"
  prohibited: [KU-G-001, KU-G-005, KU-G-002]
  expected_conversion: null

# ══════════ SEG-02 자산편중 ══════════
- id: SC-02-A
  segment: SEG-02
  name: "현금성자산 방치 — 인지시키고 희망 유형을 물어 분기 (Mission 1)"
  entry_condition:
    - {field: 고유계정대_보유비율, op: ">=", value: 0.50}
    - {field: 오탐제거_2조건, op: "==", value: "통과"}
  qualifying_questions:
    - ask: "계좌에 운용지시가 안 된 현금성자산이 {금액}원 있는데 알고 계셨어요?"
      branches: ["몰랐다 → 인지 유도 성공, 바로 대안 제시", "알고 있다 → 이유를 묻는다(사용 계획 여부 재확인)"]
    - ask: "펀드 같은 실적배당형과 원금이 보존되는 원리금보장형 중 어느 쪽을 희망하세요?"
      branches: ["원리금보장 → GIC·저축은행 정기예금 (SC-02-B로)", "실적배당 → 추천펀드·TDF", "모르겠다 → 디폴트옵션을 표준 대안으로"]
  turns:
    - {step: 0, actor: 행원, say: KU-M-004, purpose: "접촉 전 오탐 제거 — 입금사유·변동 여부 확인"}
    - {step: 1, actor: 행원, say: KU-S-005, purpose: "통화 가능 여부 (3분이면 가능한데)"}
    - {step: 2, actor: 행원, say: KU-S-011, purpose: "Step2~4 — 현황 → 금리 비교 → 희망 유형 질문"}
    - {step: 3, actor: 행원, say: KU-S-016, purpose: "규모를 낮춰 닫기"}
  objection_cards: [KU-S-015, KU-S-009, KU-S-004]
  success_action:
    cart_items: ["현금성자산 {금액}원 → {상품} 교체매매"]
    procedure_ku: [KU-P-002, KU-P-003]
    memo_template: "현금성자산 {비율}% 안내, {금액}원 전환 합의. 상품변경 URL 발송 — 직원명 수기 입력 안내 완료."
  partial_action:
    cart_items: ["일부만 합의 → 나머지는 6개월 뒤 재점검 항목으로"]
  fail_action:
    say: KU-S-004
    followup: "다음 만기 시점 또는 3개월 뒤 재접촉"
  prohibited: [KU-G-004, KU-G-002, KU-G-006, KU-G-013]
  expected_conversion: null

- id: SC-02-B
  segment: SEG-02
  name: "현금성자산 + 시중은행 정기예금 100% — 같은 안전성에서 금리만 올린다 (Mission 2)"
  entry_condition:
    - {field: "고유계정대+시중은행정기예금_보유비율", op: "==", value: 1.00}
  qualifying_questions:
    - ask: "지금 보유하신 정기예금 금리가 몇 %인지 알고 계세요?"
      branches: ["모른다 → 실측 금리 제시가 곧 오프너", "안다 → 곧바로 대안 금리와 비교"]
    - ask: "예금자보호가 되는 상품 안에서 금리만 더 높은 걸로 바꾸시는 건 어떠세요?"
      branches: ["긍정 → GIC·저축은행 정기예금 제안", "타행 상품이라 유지하고 싶다 → 만기 시점 재접촉 예약"]
  turns:
    - {step: 0, actor: 행원, say: KU-M-027, purpose: "당월 특별제공상품 금리 조회 (상담 전 필수)"}
    - {step: 1, actor: 행원, say: KU-S-014, purpose: "인정 → 금리 대 금리 비교 → 대안 제시"}
    - {step: 2, actor: 행원, say: KU-F-002, purpose: "예금자보호 1억원으로 안전성 우려 해소"}
    - {step: 3, actor: 행원, say: KU-F-021, purpose: "금리가 비슷하면 실물이전 불가 상품으로 유도 (락인)"}
  objection_cards: [KU-S-015, KU-S-004]
  success_action:
    cart_items: ["시중은행 정기예금 매도 → GIC 또는 저축은행 정기예금 매수"]
    procedure_ku: [KU-M-007, KU-P-002]
    memo_template: "보유 정기예금 {금리}% vs 대안 {금리}% 비교 안내, {금액}원 교체 합의."
  partial_action:
    cart_items: ["만기 도래분부터 순차 교체 → SEG-06 트랙으로 연결"]
  fail_action:
    say: KU-S-004
    followup: "보유 상품 만기 D-30 시점 재접촉 예약"
  prohibited: [KU-G-004, KU-G-005, KU-G-013]
  expected_conversion: null

- id: SC-02-C
  segment: SEG-02
  name: "원리금보장 100% — 디폴트옵션(저위험 이상)을 표준 대안으로"
  entry_condition:
    - {field: 원리금보장상품_비중, op: "==", value: 1.00}
    - {field: 적립금_평가금액, op: ">=", value: 3000000}
  qualifying_questions:
    - ask: "디폴트옵션은 등록해 두셨을까요?"
      branches: ["미등록 → 등록 + 교체매매 세트 (SC-03-B와 동일 처리)", "초저위험 등록 → 2단계 상향 안내", "저위험 이상 → 보유상품 구성만 조정"]
    - ask: "투자성향 검사는 언제 하셨어요?"
      branches: ["오래됨/공격투자형인데 초저위험 → 불일치를 근거로 상향", "안정형 → 원리금보장 내 금리 상향으로"]
  turns:
    - {step: 1, actor: 행원, say: KU-S-005, purpose: "용건 — 원리금보장상품만으로 구성되어 있어 수익률 관리 안내"}
    - {step: 2, actor: 행원, say: KU-S-006, purpose: "구성이 원인임을 짚고 일부 전환"}
    - {step: 3, actor: 행원, say: KU-F-005, purpose: "디폴트옵션 설명 요구 시 제도 개요"}
    - {step: 4, actor: 행원, say: KU-M-014, purpose: "⚠ 초저위험 → 저위험 이상은 2단계 거래임을 미리 알린다"}
  objection_cards: [KU-S-009, KU-S-015, KU-S-004]
  success_action:
    cart_items: ["디폴트옵션 등급 변경 (등록/변경)", "보유상품 변경 (매도 + 매수)"]
    procedure_ku: [KU-P-011, KU-P-002]
    memo_template: "원리금보장 100% 안내, 디폴트옵션 {등급} 상향 합의. ⓐ등록변경 + ⓑ보유상품변경 2단계 처리 완료 여부 확인 필요."
  partial_action:
    cart_items: ["ⓐ만 처리된 경우 → ⓑ 미완료 알림 필수"]
    note: "여기서 멈추면 절반 처리 — 자금이 움직이지 않는다"
  fail_action:
    say: KU-S-016
    followup: "6개월 뒤 재점검"
  prohibited: [KU-G-004, KU-G-003, KU-G-002]
  expected_conversion: null

# ══════════ SEG-03 방치 ══════════
- id: SC-03-A
  segment: SEG-03
  name: "퇴직금 입금 후 운용지시 미실행 — 편중으로 전이되기 전에 잡는다"
  entry_condition:
    - {field: 퇴직금_입금여부, op: "==", value: true}
    - {field: 운용지시_실행여부, op: "==", value: false}
  qualifying_questions:
    - ask: "퇴직금이 IRP로 잘 들어온 건 확인하셨죠? 지금 어떤 상품으로 운용되고 있는지도 보셨어요?"
      branches: ["몰랐다 → 미운용 상태 인지시키기", "알고 있다 → 사용 계획 여부 확인"]
    - ask: "이 자금 중 당장 쓰실 부분이 있으세요?"
      branches: ["있다 → 그 금액은 남기고 나머지만 운용", "없다 → 전액 운용 설계"]
    - ask: "연금으로 나눠 받으실 계획이세요, 일시금으로 쓰실 계획이세요?"
      branches: ["연금 → 투자가능기간을 수령 종료 시점까지 재계산", "일시금 → 인출 설계 우선, 투자상품 권유 중단"]
  turns:
    - {step: 0, actor: 행원, say: KU-M-013, purpose: "운용지시 여부·금액 확인"}
    - {step: 1, actor: 행원, say: KU-S-017, purpose: "전담직원 인사 오프너"}
    - {step: 2, actor: 행원, say: KU-S-011, purpose: "미운용 금액 인지 + 희망 유형 질문"}
    - {step: 3, actor: 행원, say: KU-S-018, purpose: "방치 = 연금수령액 감소 프레이밍"}
  objection_cards: [KU-S-019, KU-S-015, KU-S-004]
