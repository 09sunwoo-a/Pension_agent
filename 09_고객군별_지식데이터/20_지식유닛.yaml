    "운용사의 관심도가 떨어져 향후에도 개선이 어려울 수 있다" → 매도 후 재추천.
    2021년 자료는 전략펀드·ETF로, 2023~24 TM 스크립트는 디폴트옵션으로 갈아타게 유도한다.
