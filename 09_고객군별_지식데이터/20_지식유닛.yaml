    기존 고객 관리 4수칙 순서:
    ① 현황 스캔 (조회 → 파악 → 대화를 만날 때마다 반복)
    ② 만기 1개월 전 반드시 만기 안내
    ③ 수익률이 낮으면 포트폴리오 리밸런싱 제안
    ④ 대면 계좌면 비대면 전환 시 수수료 인하 안내
    점검 주기는 6개월~1년. "6개월이나 1년에 한 번씩 점검해드리니 고객이 찾아와서 추가 변경을 요청한다."
    재접촉을 그 자리에서 심는 것이 사이클을 돌게 만든다.
