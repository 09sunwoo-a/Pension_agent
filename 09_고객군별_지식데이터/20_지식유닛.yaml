    - "본부 관점(ETF 보유자=위험군)과 현장 관점(ETF 미보유자=잠재군)은 정반대 모집단"
  source: {doc: "스타런 교육영상 [통합] 연금고객 이탈방지 상담 해결책", section: "패널 토론", org: "연금사업부", date: "2024 추정"}
