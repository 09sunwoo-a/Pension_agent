    만기 자금 관리는 매월 첫째 주 만기명세로 돌린다.
    실행 채널 3경로(스타뱅킹·영업점 창구·전용상담센터 전화)의 상품 제약을 먼저 확인한다 —
    전화 센터(1599-0099·1833-3700)는 원리금보장상품만 처리 가능.
