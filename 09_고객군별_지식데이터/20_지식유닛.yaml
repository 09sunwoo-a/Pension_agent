- id: KU-M-014
  type: method
  title: "디폴트옵션 등록은 기존 고유대 자금 교체매매와 반드시 세트로 묶는다"
  segments: [SEG-02, SEG-03, SEG-06]
  trigger: "디폴트옵션 미등록 + 현금성자산 보유 계좌"
  body: |
    디폴트옵션을 등록해도 이미 고유계정대에 있는 자금은 그대로 남는다.
    따라서 두 거래를 세트로 처리한다.
    ① 이미 만기가 되어 고유계정대에 있는 자금 → 교체매매로 고금리 상품 이동
    ② 앞으로 만기가 될 자금 → 디폴트옵션 등록으로 자동화
    디폴트옵션 초저위험 → 저위험 이상 상향은 ⓐ 사전지정운용제도 등록/변경 → ⓑ 보유상품 변경의
    2단계 거래이며, 하나만 하면 절반 처리다.
  numbers: []
  screens: []
  cautions:
    - "⚠ ⓐ에서 멈추면 절반 처리 — 반드시 ⓑ까지 안내"
    - "사내 스크립트(2단계·매도 필요)와 KBthink(매도 불필요) 서술이 상충 — 절차 18번 최우선 상충 항목"
