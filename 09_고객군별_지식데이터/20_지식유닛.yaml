- id: KU-M-015
  type: method
  title: "이탈 사유가 특정되면 5개 유형별로 대안을 분기한다"
  segments: [SEG-04]
  trigger: "경청으로 이탈 사유를 파악한 직후"
  body: |
    본부 5분류:
    ① ETF 투자 목적 증권사 이전 → ETF의 허와 실 진단 + 90/10 원칙, 대표지수 장기투자 프레임
    ② 당행 ETF 상품 수 불만 → 라이선스 구조·상품위원회 선별 = '큐레이션' 프레임
    ③ 증권사 IRP 수수료 무료 → 면제 조건 3분기 + 장기할인 승계 비대칭
    ④ 대출 금리로 인한 동반 이전 → 두 상품의 판단 기준을 분리
    ⑤ 수익률 부진·자산관리 미흡 → 사과 → 원인 규명 → 즉시 리밸런싱
    현장판 4분류(ETF 라인업 / 낮은 수익률 / 수수료 / 관리 소홀)와 같은 계보다.
    등급(VIP)은 사유가 아닌 별도 축으로, 실제로는 '사유 × 등급' 2차원으로 작동한다.
  numbers: []
  screens: []
  cautions: []
  source: {doc: "스타런 이탈방지상담 교육영상 5편", section: "-", org: "연금사업부", date: "2024 추정"}
