  title: "만기를 '재설계 창구'로 쓴다 — 방치하면 현금성자산이 된다"
  segments: [SEG-06]
  trigger: "원리금보장상품 만기가 1개월 앞으로 다가왔을 때"
  body: |
    "둘. 만기 1개월 전, 반드시 만기 안내를 해주세요." (본부 기존 고객 관리 4원칙 중 두 번째)
    "퇴직연금 정기예금 만기 = 펀드상품으로 리밸런싱할 수 있는 최적의 시점"
    만기는 고객이 이상하게 여기지 않는 유일한 접촉 명분이고, 기한이 붙어 우선순위가 자동으로 정해진다.
    운용지시가 없으면 만기자금은 대기 중인 현금성자산으로 상환된다.
