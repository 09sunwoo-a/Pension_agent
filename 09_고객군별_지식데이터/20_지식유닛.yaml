- id: KU-E-001
  type: evidence
  title: "편중 계좌의 이탈위험도는 일반 고객의 1.3배"
  segments: [SEG-02, SEG-04]
  trigger: "편중 고객에게 접촉 명분을 제시할 때 / 리밸런싱을 최우선에 두는 이유를 설명할 때"
  body: |
    '25.11~'26.4(6개월) 이탈고객 분석 결과, ① 고유계정대를 50% 이상 보유하거나
    ② 고유계정대 및 시중은행 정기예금을 100% 보유 중인 고객의 이탈위험도가
    일반 고객 대비 1.3배 높았다 (이탈률 14.8% vs 11.8%).
    본부가 리밸런싱 관리 최우선 세그먼트로 지정한 근거이며, 총 적립금 1천만원 이상 고객에게
    타깃리스트가 제공된다.
  numbers:
