- id: KU-M-022
  type: method
  title: "추가납 마케팅 시점 — 세액공제는 '납입 시점' 기준, 11월이 실질 마감"
  segments: [SEG-05]
  trigger: "추가납 캠페인 시점을 설계할 때"
  body: |
    세액공제는 납입 시점 기준이므로 12월 말이 아니라 11월이 실질 마감이다.
    자금이 움직이는 시기를 미리 특정하는 연간 캘린더 로직과 결합해
    ① ISA 만기 도래 시점 ② 퇴직금 지급 시즌(1분기·희망퇴직) ③ 연말 절세(11~12월) 순으로 배치한다.
    "퇴직연금 시즌은 11·12월이 아니다"라는 시점 인식(연수교안)과 함께 읽는다.
