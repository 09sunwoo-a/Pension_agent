- id: KU-M-024
  type: method
  title: "ISA 만기자금은 60일 이내 전환 + 3년 주기 재순환으로 설계한다"
  segments: [SEG-05]
  trigger: "ISA 만기가 도래했거나 2~1개월 앞둔 고객"
  body: |
    ① 만기일로부터 60일 이내 IRP 입금 (전부 또는 일부 선택 가능)
    ② 전환금액의 10%(최대 300만원)만큼 세액공제 한도 추가
    ③ 연 1,800만원 납입한도와 무관하게 전액 전환 가능
    ④ 횟수 무제한 — ISA 만기 → IRP 전환 → ISA 재가입의 3년 주기 사이클로 반복
    ⑤ 타행 ISA도 대상 (마이데이터로 확인)
    ⑥ 사전관리: 만기 2~1개월 전 접촉이 만기 후 60일 타이머보다 앞선 관리 지점
    ⑦ 만기가 먼 ISA라도 가입 3년 경과면 해지 후 IRP 이전 판단이 가능
  numbers:
