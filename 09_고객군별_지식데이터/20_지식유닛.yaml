- id: KU-E-007
  type: evidence
  title: "증권사 이탈 고객의 약 82%가 ETF 투자자 — 단 3년 수익률은 공모펀드가 7%p 우위"
  segments: [SEG-04]
  trigger: "ETF를 이유로 증권사 이전을 말하는 고객을 최고위험군으로 판단할 때"
  body: |
    미래에셋증권으로 이동한 고객을 분석한 결과 약 82%가 ETF 투자를 하고 있었다.
    다만 ETF와 공모펀드의 3년 수익률 비교에서는 공모펀드가 약 7%p 높았다 —
    "ETF가 더 낫다"는 인식이 근거가 약하다는 반론 재료다.
    현장은 역방향 관점도 쓴다: 정기예금·펀드로만 운용 중인 고객을 증권사 이탈 잠재군으로 보고
    ETF 100% 운용지시(주식형·혼합형 70% + 채권형·혼합형 30%)로 선제 방어.
  numbers:
    - {label: "이탈 고객 중 ETF 투자자 비중", value: "약 82%", as_of: "2024 추정", verify: true}
    - {label: "3년 수익률 격차 (공모펀드 우위)", value: "약 7%p", as_of: "미상", verify: true}
  screens: []
  cautions:
