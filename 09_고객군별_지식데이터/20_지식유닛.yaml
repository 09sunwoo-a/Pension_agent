- id: KU-M-012
  type: method
  title: "2026 하반기 고객관리활동 인정 요건 — 리밸런싱의 표준 단위"
  segments: [SEG-02, SEG-06]
  trigger: "리밸런싱 실행 규모·상품을 정할 때 (내부 실적 관점)"
  body: |
    인정 요건: 수탁고 1천만원 이상 고객 대상, 고유대 또는 시중은행 정기예금 1천만원 이상 매도 + 상품변경
    (최초 1회 한), 저축은행·TDF로 변경해야 인정 (시중은행 정기예금 매수 미인정).
    실적점: 창구는 등록 직원 소속, 비대면은 고객이 입력한 관리희망부점. 타지점 계좌 변경도 인정.
    함의 ① 리밸런싱 최소 단위가 표준화됨 ② 고객당 1회 → 한 번에 제대로 ③ 타지점 계좌 인정 → 관리 사각을 다른 지점이 메울 수 있음.
  numbers:
    - {label: "최소 매도 금액", value: "1,000만원", as_of: "2026 하반기", verify: true}
  screens: []
  cautions:
