- id: KU-E-010
  type: evidence
  title: "E-E-T 과세체계 — 추가납입 설득을 하나로 묶는 프레임"
  segments: [SEG-05]
  trigger: "왜 IRP에 더 넣어야 하는지를 큰 그림으로 설명할 때"
  body: |
    납입 단계 공제(Exempt) → 운용 단계 과세이연(Exempt) → 수령 단계 과세(Taxed).
    세 단계가 각각 혜택이므로 "평생 절세 통장"이라는 하나의 프레임으로 설명한다.
    운용 중 이자·배당·평가차익은 비과세로 재투자되고 금융소득종합과세에서 제외된다.
